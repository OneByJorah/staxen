name: Screenshots

# Manual or on push to main. Never on pull requests from forks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write
  pull-requests: write

# A push and a manual run can race on the same bot branch; keep one.
concurrency:
  group: screenshots-${{ github.repository }}
  cancel-in-progress: false

jobs:
  screenshots:
    uses: ./.github/workflows/reusable-screenshots.yml
    with:
      base-url: http://127.0.0.1:8085
      health-url: http://127.0.0.1:8085/
